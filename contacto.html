<body> 
  <nav class="navbar navbar-expand-lg bg-body-tertiary">

    <a class="navbar-brand" href="#">Tienda JL</a>

<!-- Formulario de contacto -->
<main id="contenido-principal" class="container py-5 flex-grow-1">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <section class="card shadow-sm border-0" aria-labelledby="titulo-contacto">
          <div class="card-header bg-danger-subtle text-danger-emphasis text-center py-3 border-bottom-0">
             <h1 id="titulo-contacto" class="h3 mb-0">Contáctanos</h1>
          </div>
                    <div class="card-body p-4 p-md-5" style="background-color: #fbf8f3;">
                        <p class="text-secondary mb-4 text-center">¡Hablemos! 🛍️
                          Estamos de este lado para armar tu look perfecto y acompañarte en tu compra. Escribinos para recibir asesoramiento personalizado</p>
                        
          <form action="#" method="post">
                            
           <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre completo <span class="text-danger" aria-hidden="true">*</span></label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Melina García" aria-required="true" required>
           </div>

           <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Correo electrónico <span class="text-danger" aria-hidden="true">*</span></label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="melinagarcia@ejemplo.com" aria-required="true" required>
           </div>

           <div class="mb-4">
                                <label for="mensaje" class="form-label fw-semibold">Mensaje <span class="text-danger" aria-hidden="true">*</span></label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Contanos en qué te podemos ayudarte..." aria-required="true" required></textarea>
           </div>

           <div class="d-grid">
                                <button type="submit" class="btn bg-danger-subtle text-danger-emphasis border-danger-subtle fw-bold w-100">Enviar Mensaje</button>
           </div>

          </form>
        </div>
      </section>

    </div>
  </div>
</main>

<!-- Pie de página -->
  <footer class="text-light py-4 mt-auto" style="background-color: #800020;">
    <div class="container text-center">
      <p class="mb-1 fw-semibold">Tienda JL &copy; 2026</p>
    </div>
  </footer>

</body>
