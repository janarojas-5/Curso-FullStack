  <link href="estilos.css" rel="stylesheet">

<body> 
    <nav class="navbar navbar-tienda py-1">
  <div class="container-fluid px-4">
    
    <!-- Lado Izquierdo: Botón Hamburguesa + Nombre de la Tienda -->

      <button class="btn-hamburguesa" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <a class="navbar-brand mb-0 h1 fw-bold text-danger-emphasis" href="inicio.html">
        <img src="img/logo.png" alt="Logo Tienda JL" width="40" height="40" class="d-inline-block me-2 rounded-circle">
        Tienda JL
      </a>
    </div>

  </div>
</nav>

<!-- MENÚ LATERAL -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
  <div class="offcanvas-header">
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
<div class="offcanvas-body">
  <ul class="list-unstyled fs-5">
    <li><a class="text-decoration-none text-dark" href="inicio.html">Inicio</a></li>
    <li class="menu-con-submenu">
      <span class="texto-no-link">Productos</span>
      <ul class="submenu list-unstyled">
        <li><a class="text-decoration-none text-dark" href="buzos.html">Buzos</a></li>
        <li><a class="text-decoration-none text-dark" href="pantalones.html">Pantalones</a></li>
      </ul>
    </li>
   <li><a class="text-decoration-none text-dark" href="contacto.html">Contacto</a></li>
  </ul>
</div>
</div>

<!-- Formulario de contacto -->
<main id="contenido-principal" class="container py-5 flex-grow-1">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <section class="card shadow-sm border-0" aria-labelledby="titulo-contacto">
          <div class="card-header bg-danger-subtle text-danger-emphasis text-center py-3 border-bottom-0">
             <h1 id="titulo-contacto" class="h3 mb-0">Contáctanos</h1>
          </div>
                    <div class="card-body p-4 p-md-5" style="background-color: #fbf8f3;">
                        <p class="text-secondary mb-4 text-center">¡Hablemos! 🛍️
                          Estamos de este lado para armar tu look perfecto y acompañarte en tu compra. Escribinos para recibir asesoramiento personalizado</p>
                        
          <form action="#" method="post">
                            
           <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre completo <span class="text-danger" aria-hidden="true">*</span></label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Melina García" aria-required="true" required>
           </div>

           <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Correo electrónico <span class="text-danger" aria-hidden="true">*</span></label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="melinagarcia@ejemplo.com" aria-required="true" required>
           </div>

           <div class="mb-4">
                                <label for="mensaje" class="form-label fw-semibold">Mensaje <span class="text-danger" aria-hidden="true">*</span></label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Contanos en qué te podemos ayudarte..." aria-required="true" required></textarea>
           </div>

           <div class="d-grid">
                                <button type="submit" class="btn bg-danger-subtle text-danger-emphasis border-danger-subtle fw-bold w-100">Enviar Mensaje</button>
           </div>

          </form>
        </div>
      </section>

    </div>
  </div>
</main>

<!-- Pie de página -->
  <footer class="text-light py-3 mt-auto" style="background-color: #800020;">
    <div class="container text-center">
      <p class="mb-1 fw-semibold">Tienda JL &copy; 2026</p>
    </div>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!--menu mobile/tablet-->
<script src="menu.js"></script>

</body>
</html>
